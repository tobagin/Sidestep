# Bootloader unlocking steps
unlocking_steps:
  - order: 1
    title: "Enable Developer Options"
    description: "Go to Settings > About Phone and tap 'Build Number' 7 times"
    type: manual
  - order: 2
    title: "Enable OEM Unlocking"
    description: "Go to Settings > System > Developer Options and enable 'OEM unlocking'"
    type: manual
  - order: 3
    title: "Unlock with Mi Unlock"
    description: "Add your account in Developer Options > Mi Unlock status, then unlock using Xiaomi's Mi Unlock tool on a PC. Xiaomi enforces a mandatory waiting period (up to 7+ days)."
    type: manual

# Bootloader unlocking steps (Samsung download mode)
unlocking_steps:
  - order: 1
    title: "Enable Developer Options"
    description: "Go to Settings > About Phone > Software information and tap 'Build number' 7 times"
    type: manual
  - order: 2
    title: "Enable OEM Unlocking"
    description: "Go to Settings > Developer Options and enable 'OEM unlocking'. If the toggle is missing, connect to the internet and wait a few days."
    type: manual
    warning: "Some carrier variants cannot be unlocked"
  - order: 3
    title: "Boot to Download Mode"
    description: "Power off, then hold Volume Up + Volume Down (older models: Volume Down + Home + Power) and connect the USB cable to your PC."
    type: manual
  - order: 4
    title: "Unlock Bootloader"
    description: "In download mode, long-press Volume Up to unlock. Flashing then uses the Odin protocol (Heimdall)."
    type: manual
    warning: "This will factory reset your device!"

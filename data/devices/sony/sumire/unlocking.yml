# Bootloader unlocking steps
unlocking_steps:
  - order: 1
    title: "Enable Developer Options"
    description: "Go to Settings > About Phone and tap 'Build Number' 7 times"
    type: manual
  - order: 2
    title: "Enable OEM Unlocking"
    description: "Go to Settings > System > Developer Options and enable 'OEM unlocking'"
    type: manual
  - order: 3
    title: "Reboot to Bootloader"
    description: "Reboot the device into fastboot mode"
    type: automated
    command: "adb reboot bootloader"
    duration_secs: 10
  - order: 4
    title: "Get Unlock Code from Sony"
    description: "Request an unlock code from Sony's official Unlock Bootloader page using your IMEI."
    type: manual
  - order: 5
    title: "Unlock Bootloader"
    description: "Run the OEM unlock command with the code from Sony (prefixed with 0x)"
    type: automated
    command: "fastboot oem unlock 0x<code>"
    warning: "This will factory reset your device and erase DRM keys!"
    duration_secs: 30

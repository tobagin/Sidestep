name: "postmarketOS"
prerequisites:
  - title: "Pre-requisites"
    check: "android_version_12"
    message: "postmarketOS for Pixel 3a XL requires Android 12 Stock firmware.\n\nRequired build: SP2A.220505.008 (or any Android 12 build)\nCheck: Settings → About phone → Build number\n\nAre you running Android 12?"
    on_success: "install"
    on_failure: "upgrade"
steps:
  upgrade:
    type: "flash_android"
    android_version: "Android 12 (SP2A.220505.008)"
    url: "https://dl.google.com/dl/android/aosp/bonito-sp2a.220505.008-factory-db19d2aa.zip"
    sha256: "db19d2aaff36f29b7f58f11acad856f9382dafa1ae9160a692782e27cd7b0002"
    message: "This will download and flash Android 12 to your Pixel 3a XL.\n\nThis will ERASE ALL DATA on the device.\nDownload size: ~1.8 GB."
  install:
    type: "flash"
    url: ""
# postmarketOS ships a boot image (…-boot.img.xz) + rootfs (…img.xz); the
# installer downloads/decompresses both and flashes per these operations.
flash_operations:
  - type: flash
    partition: "boot"
    source: "boot"
  - type: flash
    partition: "userdata"
    source: "rootfs"

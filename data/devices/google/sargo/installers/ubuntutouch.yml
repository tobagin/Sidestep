name: "Ubuntu Touch"
prerequisites:
  - title: "Pre-requisites"
    check: "android_version_9"
    message: "Ubuntu Touch for Pixel 3a requires Android 9 Stock firmware.\n\nRequired build: PQ3B.190801.002\nCheck: Settings → About phone → Build number\n\nAre you running Android 9?"
    on_success: "install"
    on_failure: "downgrade"
steps:
  downgrade:
    type: "flash_android"
    android_version: "Android 9 (PQ3B.190801.002)"
    url: "https://dl.google.com/dl/android/aosp/sargo-pq3b.190801.002-factory-56817dc2.zip"
    sha256: "56817dc2993f0b3b6cf1972c74329ff154465849b8284731a27f8284a12fee5f"
    message: "This will download and flash Android 9 to your Pixel 3a.\n\nThis will ERASE ALL DATA on the device.\nDownload size: ~1.5 GB."
  install:
    type: "flash"
    url: ""
firmware:
  - url: "https://cdimage.ubports.com/devices/sargo/boot.img"
    filename: "boot.img"
    partition: "boot"
    sha256: "3125fa5cdd097cd69b8005af13e4c6a4a4cc61b83c6b13b219799def51fff2fa"
  - url: "https://cdimage.ubports.com/devices/sargo/dtbo.img"
    filename: "dtbo.img"
    partition: "dtbo"
    sha256: "51e63686ee4bb15e1ddc296f8809996d645d114347daebacc561cf02d2bfce2d"
  - url: "https://cdimage.ubports.com/devices/sargo/vbmeta.img"
    filename: "vbmeta.img"
    partition: "vbmeta"
    sha256: "854a2c2a5e82c2c49a5d9d62c70334002c7dcd9203f904952ff5fc43b2eac420"
    flags:
      - "--disable-verity"
      - "--disable-verification"

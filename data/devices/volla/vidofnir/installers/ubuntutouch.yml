name: Ubuntu Touch
prerequisites: []
steps:
  install:
    type: flash
    url: ''
ubports_downloads:
- url: https://volla.tech/filedump/volla-vidofnir-12.0-ubports-installer-bootstrap-v3.zip
  filename: volla-vidofnir-12.0-ubports-installer-bootstrap-v3.zip
  sha256: da18b5498ebae0267be894fff73bfd629be73967cf33f071d571ffc3ef46ce97
  unpack: true
bootstrap:
- op: set_active
  slot: a
- op: flash
  partition: lk_a

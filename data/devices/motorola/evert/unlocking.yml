# Bootloader unlocking steps
unlocking_steps:
  - order: 1
    title: "Enable Developer Options"
    description: "Go to Settings > About Phone and tap 'Build Number' 7 times"
    type: manual
  - order: 2
    title: "Enable OEM Unlocking"
    description: "Go to Settings > System > Developer Options and enable 'OEM unlocking'"
    type: manual
  - order: 3
    title: "Reboot to Bootloader"
    description: "Reboot the device into fastboot mode"
    type: automated
    command: "adb reboot bootloader"
    duration_secs: 10
  - order: 4
    title: "Get Unlock Code from Motorola"
    description: "Request an unlock code for your device from Motorola's bootloader unlock page, then unlock."
    type: manual
  - order: 5
    title: "Unlock Bootloader"
    description: "Run the OEM unlock command with the code from Motorola"
    type: automated
    command: "fastboot oem unlock <code>"
    warning: "This will factory reset your device!"
    duration_secs: 30

app-id: io.github.tobagin.Sidestep
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: sidestep

finish-args:
  # USB access for adb/fastboot
  - --device=all
  # Wayland and X11 display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Network for downloading images
  - --share=network
  # Access to Downloads folder for images
  - --filesystem=xdg-download/sidestep:create
  # dconf/gsettings (sandboxed access only)
  # - --filesystem=xdg-run/dconf
  # - --filesystem=~/.config/dconf:ro
  # - --talk-name=ca.desrt.dconf
  # - --env=DCONF_USER_CONFIG_DIR=.config/dconf

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Enable network for development builds
  build-args:
    - --share=network

modules:
  # Android platform tools (adb, fastboot, mke2fs)
  # Pinned to 33.0.3 to match UBports installer — fastboot 36.0.2 has a
  # regression where --disable-verity --disable-verification flags fail
  # with "Failed to find AVB_MAGIC at offset: 0".
  - name: android-tools
    buildsystem: simple
    build-commands:
      - install -Dm755 adb ${FLATPAK_DEST}/bin/adb
      - install -Dm755 fastboot ${FLATPAK_DEST}/bin/fastboot
      - install -Dm755 mke2fs ${FLATPAK_DEST}/bin/mke2fs
      - test -f mke2fs.conf && install -Dm644 mke2fs.conf ${FLATPAK_DEST}/etc/mke2fs.conf || true
    sources:
      - type: archive
        url: https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
        sha256: ab885c20f1a9cb528eb145b9208f53540efa3d26258ac3ce4363570a0846f8f7
        strip-components: 1
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/lzhiyong/android-sdk-tools/releases/download/33.0.3/android-sdk-tools-static-aarch64.zip
        sha256: 15aa3efa6609ae83a0122147f9940a96583c287922dcce84bff2b19d0b395898
        strip-components: 2
        only-arches:
          - aarch64

  # Newer fastboot (36.0.2) bundled ALONGSIDE 33.0.3, used only by the GrapheneOS
  # installer (recent Pixels like the Pixel 9 series need platform-tools 35+).
  # GrapheneOS flashes a proper factory vbmeta and never uses the --disable-verity
  # rewrite path, so it can't hit the AVB_MAGIC regression that pins 33.0.3.
  - name: platform-tools-grapheneos
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 fastboot ${FLATPAK_DEST}/opt/platform-tools-36/fastboot
    sources:
      - type: archive
        url: https://dl.google.com/android/repository/platform-tools_r36.0.2-linux.zip
        sha256: 3afdea91441815ab41254193df0343d92c1b1c0d0237165c3a345c8af8891c31
        strip-components: 1
        only-arches:
          - x86_64

  # libusb — required by heimdall for USB access
  - name: libusb
    buildsystem: autotools
    config-opts:
      - --disable-udev
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
        sha256: fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf
    cleanup:
      - /include
      - /lib/pkgconfig
      - "*.la"

  # Heimdall — Samsung download-mode (Odin) flashing for Exynos devices.
  # CLI only (DISABLE_FRONTEND avoids the Qt GUI). NOTE: the Heimdall install
  # path is unverified on hardware; validate with a real Samsung device before
  # relying on it. There is no install() rule upstream, so we copy the binary.
  - name: heimdall
    buildsystem: cmake-ninja
    no-make-install: true
    config-opts:
      - -DDISABLE_FRONTEND=ON
      - -DCMAKE_BUILD_TYPE=Release
      # Heimdall 1.4.2 CMakeLists targets CMake 2.8; modern CMake needs this.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    post-install:
      - install -Dm755 bin/heimdall ${FLATPAK_DEST}/bin/heimdall
    sources:
      - type: archive
        url: https://github.com/Benjamin-Dobell/Heimdall/archive/refs/tags/v1.4.2.tar.gz
        sha256: 589bef88f2597c8a84fe6fafbe928ddc9687438b5b54edd917d7df48c7e3eff8

  # Main application
  - name: sidestep
    buildsystem: meson
    config-opts:
      - -Dprofile=development
    sources:
      - type: dir
        path: ..
    build-options:
      env:
        CARGO_HOME: /run/build/sidestep/cargo

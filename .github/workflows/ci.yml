name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # ubuntu-latest ships libadwaita 1.5, but the app needs >= 1.6 (v1_6 feature).
    # Build in a Fedora container that has current GTK4 / libadwaita.
    container: fedora:42
    steps:
      # nodejs + git must exist in the container for the JS actions below.
      - name: Container dependencies
        run: >
          dnf install -y nodejs git gcc pkgconf-pkg-config
          gtk4-devel libadwaita-devel openssl-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Gating checks — these must pass.
      - name: Build
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      # Informational until the existing style/clippy backlog is cleared.
      - name: Format
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets
        continue-on-error: true

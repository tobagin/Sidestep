name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/libadwaita dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Gating checks — these must pass.
      - name: Build
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      # Informational — surfaced but not blocking until the existing backlog of
      # style/clippy findings is cleared. Flip to blocking once it's green.
      - name: Format
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets
        continue-on-error: true
